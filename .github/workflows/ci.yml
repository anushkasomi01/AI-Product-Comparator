name: Backend CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run deterministic tests
        run: |
          set -o pipefail
          mkdir -p target
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee target/ci-build.log
      - name: Annotate build or test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          for report in reports:
              for case in ET.parse(report).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      problem = case.find(tag)
                      if problem is not None:
                          text = (problem.get('message') or problem.text or tag)[:3000]
                          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print(f"::error file={case.get('classname','')}.java::"
                                f"{case.get('name','test')}: {text}")
          log = Path('target/ci-build.log')
          if log.exists():
              errors = [line for line in log.read_text().splitlines() if line.startswith('[ERROR]')]
              for line in errors[:10]:
                  text = line[:3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error file=pom.xml::' + text)
          PY
      - name: Publish test totals
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          executed = totals['tests'] - totals['skipped']
          summary = (f"Deterministic suite: {executed} executed, {totals['failures']} failures, "
                     f"{totals['errors']} errors, {totals['skipped']} opt-in live tests skipped.")
          print('::notice title=Test results::' + summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Test results\n\n' + summary + '\n')
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/*.jar
          if-no-files-found: warn
          retention-days: 7
