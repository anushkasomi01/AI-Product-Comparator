name: Live Ollama smoke test

# Manual or workflow-change verification: downloads a small model and uses CI compute.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'arena/**']
    paths:
      - '.github/workflows/live-model-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLLAMA_MODEL: qwen2.5:0.5b-instruct
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      RUN_LIVE_AI_TESTS: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned Ollama release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/ollama/ollama/releases/download/v0.40.13/install.sh \
            --output "$RUNNER_TEMP/install-ollama.sh"
          OLLAMA_VERSION=0.40.13 sh "$RUNNER_TEMP/install-ollama.sh"
      - name: Start model server and pull a small test model
        run: |
          set -euo pipefail
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          timeout 60 bash -c 'until curl --fail --silent "$OLLAMA_BASE_URL/api/tags" >/dev/null; do sleep 1; done'
          ollama pull "$OLLAMA_MODEL"
      - name: Test actual Spring AI to Ollama connectivity
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=LiveModelSmokeTest test
      - name: Verify packaged HTTP endpoint with the real model
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          java -jar target/laptop-finder-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/application.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          timeout 60 bash -c 'until curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; do sleep 1; done'
          curl --fail --silent --show-error --max-time 120 \
            -H 'Content-Type: application/json' \
            -d '{"message":"What is laptop RAM? Explain in one short sentence."}' \
            http://127.0.0.1:8080/api/chat > "$RUNNER_TEMP/reply.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/reply.json') as source:
              reply = json.load(source)
          assert isinstance(reply.get('answer'), str) and reply['answer'].strip(), 'Missing model answer'
          print('PASS: real model returned a nonempty answer through POST /api/chat')
          PY
